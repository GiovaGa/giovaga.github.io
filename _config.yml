bio: "I am a master's student in Computer Engineering at the <b>University of Padova</b>, nearing the end of my studies.
I am now working on my master's thesis at <b>Computing Systems Laboratory</b> of <b>Huawei Research in Zurich</b>, developing high-performance algorithms under the supervision of Denis Jelovina.
After my graduation, I will start my PhD under the supervision of prof. Torsten Hoefler at ETH Zurich, as part of <a href=\"https://spcl.ethz.ch/\">Scalable Parallel Computing Laboratory</a>."

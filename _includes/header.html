<header class="page-header">

  <img src="{{ '/images/avatar.jpg' | relative_url }}" alt="Photo of {{ site.author }}" class="avatar no-print" itemprop="image">

  <h1 class="header-name" itemprop="name">{{ site.title }}</h1>

  <div class="header-contact-info">
    <p></p>
  </div>

  <div class="title-bar no-print">
    <h2 class="header-title" itemprop="jobTitle">{{ site.tagline }}</h2>

    <ul class="icon-links">
      <li class="icon-link-item">
        <a href="{{ site.github }}" class="icon-link" itemprop="sameAs">
          <svg class="icon" viewBox="0 0 16 16" width="28" height="28" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 018 6.8c.97.004 1.95.13 2.86.38 1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </li>
      <li class="icon-link-item">
        <a href="{{ site.website }}" class="icon-link" itemprop="url">
          <svg class="icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
            <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2c1.66 0 3.2.51 4.5 1.38-.75 1.28-1.6 2.76-2.25 4.33-1.05-.64-2.2-1.02-3.25-1.02s-2.2.38-3.25 1.02C6.8 9.76 5.95 8.28 5.2 7.01 6.5 4.51 8.34 4 12 4zM4.26 6.9C5.35 8.07 7.83 9 12 9s6.65-.93 7.74-2.1A8.02 8.02 0 0120 12a8 8 0 01-16 0c0-2.21.9-4.21 2.26-5.1z"/>
          </svg>
        </a>
      </li>
    </ul>

    {% include theme-toggle.html %}
  </div>

  <div class="executive-summary" itemprop="description">
    <p>{{ site.bio }}</p>
    <p>{{ site.focus }}</p>
  </div>

  <hr/>
  <p>{{ site.seeking }}</p>
  <a href="mailto:{{ site.email }}" class="contact-button no-print" itemprop="email">Contact me</a>

</header>

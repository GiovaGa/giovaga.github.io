  This is a Jekyll-ready snippet demonstrating how to render quotes from _data/quotes.yml
  It is a copy for preview purposes and does not replace index.html in the repository.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giovanni Gaio — Computer Engineering (MSc)</title>
  </head>
  <body>
    <!-- ... other content ... -->

    <section class="content-section">
      <header class="section-header">
        <h2>Quotes I like</h2>
      </header>

      <div class="resume-item">
        <ul class="quote-list">
          {% for q in site.data.quotes %}
            <li>
              <blockquote>
                <p>{{ q.text }}</p>
                <footer>— {{ q.author }}</footer>
              </blockquote>
            </li>
          {% endfor %}
        </ul>
      </div>
    </section>

    <!-- ... other content ... -->
  </body>
</html>
